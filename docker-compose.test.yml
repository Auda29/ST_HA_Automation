services:
  ha-test:
    image: homeassistant/home-assistant:stable
    container_name: ha-test
    volumes:
      - ./tests/ha-fixture-config:/config
      - ./custom_components:/config/custom_components
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'code=$$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8123/api/); [ "$$code" = 200 ] || [ "$$code" = 401 ]'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
